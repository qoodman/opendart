[project]
name = "autotrader"
version = "0.1.0"
description = "한국투자증권 Open API 기반 중빈도 자동매매 (국내주식·ETF·미국주식)"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
autotrader = "autotrader.cli:main"

[tool.setuptools.packages.find]
include = ["autotrader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
