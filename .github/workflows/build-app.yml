name: 앱 빌드 (Windows · Mac)

# 기본 브랜치에 푸시할 때 version.py의 버전이 새것이면 Release를 자동으로 만듭니다.
# 설치된 앱은 이 Release를 보고 업데이트를 알려 줍니다.
on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write   # Release를 만들기 위해 필요

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest        # Apple Silicon (M1~M4)
            label: mac-apple-silicon
          - os: macos-15-intel      # 인텔 맥
            label: mac-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 소스 점검
        run: python dart_app.py --selftest

      - name: 앱 만들기
        run: pyinstaller --noconfirm dart_app.spec

      - name: 완성본 점검 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\DartSimpleInvest.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\DartSimpleInvest.exe "out\DART-simple-invest-windows.exe"

      - name: 완성본 점검·압축 (Mac)
        if: runner.os == 'macOS'
        run: |
          dist/DartSimpleInvest.app/Contents/MacOS/DartSimpleInvest --selftest
          codesign --force --deep --sign - dist/DartSimpleInvest.app
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent dist/DartSimpleInvest.app "out/DART-simple-invest-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DART-simple-invest-${{ matrix.label }}
          path: out/*

  release:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 버전 확인
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "d={}; exec(open('version.py', encoding='utf-8').read(), d); print(d['__version__'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V Release가 이미 있어 건너뜁니다. 새로 내려면 version.py 숫자를 올리세요."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            # CHANGELOG.md에서 이 버전 부분만 꺼내 Release 설명으로 사용
            awk -v v="$V" '$0 ~ "^## "v"$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "v$V" > notes.md
          fi

      - if: steps.v.outputs.new == 'true'
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - if: steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: release-files/*
          make_latest: true
