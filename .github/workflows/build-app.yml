name: 앱 빌드 (Windows · Mac)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write   # 태그(v1.0.0 등)를 올리면 Releases에 파일을 붙이기 위해 필요

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest        # Apple Silicon (M1~M4)
            label: mac-apple-silicon
          - os: macos-15-intel      # 인텔 맥
            label: mac-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 소스 점검
        run: python dart_app.py --selftest

      - name: 앱 만들기
        run: pyinstaller --noconfirm dart_app.spec

      - name: 완성본 점검 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\DartSimpleInvest.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\DartSimpleInvest.exe "out\DART-simple-invest-windows.exe"

      - name: 완성본 점검·압축 (Mac)
        if: runner.os == 'macOS'
        run: |
          dist/DartSimpleInvest.app/Contents/MacOS/DartSimpleInvest --selftest
          codesign --force --deep --sign - dist/DartSimpleInvest.app
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent dist/DartSimpleInvest.app "out/DART-simple-invest-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DART-simple-invest-${{ matrix.label }}
          path: out/*

      - name: 릴리스에 첨부 (태그일 때만)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
